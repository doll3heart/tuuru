name: Phone export browser regression

on:
  pull_request:
    paths:
      - 'reader/**'
      - 'js/**'
      - 'css/**'
      - 'browser-tests/phone-export/**'
      - 'tests/phone-export-browser-assertions.test.mjs'
      - 'tests/phone-export-text-layout.test.mjs'
      - 'scripts/run-phone-export-browser.mjs'
      - 'scripts/run-phone-export-text-browser.mjs'
      - 'scripts/acceptance-work-assets.mjs'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/phone-export-browser.yml'
  push:
    paths:
      - 'reader/**'
      - 'js/**'
      - 'css/**'
      - 'browser-tests/phone-export/**'
      - 'tests/phone-export-browser-assertions.test.mjs'
      - 'tests/phone-export-text-layout.test.mjs'
      - 'scripts/run-phone-export-browser.mjs'
      - 'scripts/run-phone-export-text-browser.mjs'
      - 'scripts/acceptance-work-assets.mjs'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/phone-export-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node --test tests/phone-export-browser-assertions.test.mjs tests/phone-export-text-layout.test.mjs
      - run: npm run test:phone-export:browser
      - run: npm run test:phone-export:text
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phone-export-browser-failure
          path: artifacts/phone-export-browser/
          if-no-files-found: ignore
          retention-days: 7
